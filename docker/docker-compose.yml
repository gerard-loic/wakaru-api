services:
    sylo:
        container_name: '${COMPOSE_PROJECT_NAME}'
        image: 'ghcr.io/gerard-loic/sylo:${COMPOSE_SYLO_VERSION}'
        # UID/GID de l'hôte : le serveur doit pouvoir écrire dans les bind mounts (logs/, custom/)
        user: '${COMPOSE_UID:-1000}:${COMPOSE_GID:-1000}'
        restart: ${COMPOSE_RESTART_POLICY}
        # Dev : recharge uvicorn à chaque modification dans custom/
        command: ['python', '-m', 'uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8002', '--reload', '--reload-dir', '/app/custom']
        env_file:
            - ../.env
        volumes:
            - '../logs/:/app/logs/'
            - '../custom/:/app/custom/'
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=traefik-network"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_HOST}`)"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=${COMPOSE_TRAEFIK_ENTRYPOINT}"
            - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=${COMPOSE_PROJECT_PORT}"
        networks:
            - traefik-network
        extra_hosts:
            - "host.docker.internal:host-gateway"

networks:
  traefik-network:
    external: true
